name: Verify admin build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Database tests (local Postgres)
        run: npm run test:db

      - name: Build
        run: npm run build
